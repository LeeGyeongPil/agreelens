# No keys or models needed: unit tests, the single-file build and the build checks run offline (Node.js, TypeScript, React).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday - catches dependency or runtime changes that break the build
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]   # latest 22.x and 24.x; package.json "engines" accepts ^22.22.2 || ^24.15.0 || >=26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-dist.mjs
      - run: node scripts/smoke-dist.mjs
